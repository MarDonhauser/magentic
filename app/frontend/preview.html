<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Terminal-Darstellung im Vergleich</title>
  <style>
    body { margin: 0; background: var(--page); color: var(--ink);
           font-family: var(--font-sans); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
            background: var(--border); height: 100vh; }
    .col { background: var(--term-bg); display: flex; flex-direction: column; min-width: 0; }
    h2 { margin: 0; padding: 10px 16px; font-size: var(--fs-label); font-weight: var(--fw-semibold);
         color: var(--ink-2); background: var(--panel); border-bottom: 1px solid var(--border); }
    .host { flex: 1; padding: 12px 16px; min-height: 0; }
  </style>
</head>
<body>
  <div class="grid">
    <section class="col"><h2>Vorher</h2><div class="host" id="alt"></div></section>
    <section class="col"><h2>Nachher</h2><div class="host" id="neu"></div></section>
  </div>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
