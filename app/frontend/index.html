<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="#20242b" name="theme-color"/>
    <script>
        (() => {
            let theme = 'dark';
            try {
                theme = window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            } catch { /* Dark ist der sichere Fallback, falls die Systemabfrage nicht verfügbar ist. */ }
            try {
                const saved = localStorage.getItem('magentic.theme');
                if (saved === 'light' || saved === 'dark') theme = saved;
            } catch { /* Der Theme-Controller synchronisiert den Zustand nach dem Start. */ }
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f7f8fa' : '#20242b';
        })();
    </script>
    <title>magentic</title>
</head>
<body>
<div id="titlebar">
    <div class="titlebar-rail">
        <button type="button" id="sidebar-head" aria-label="Zur Übersicht"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg> magentic</button>
    </div>
    <button type="button" id="theme-toggle" aria-label="Dunkelmodus" aria-pressed="false">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.4 15.3A8.5 8.5 0 0 1 8.7 3.6 8.5 8.5 0 1 0 20.4 15.3Z"/>
        </svg>
    </button>
</div>
<div id="layout">
    <aside id="sidebar">
        <div id="attention"></div>
        <div class="side-label">Sessions</div>
        <div id="sessions"></div>
        <div id="deploy-badge" title="Deploy-Stand — klick für Details"></div>
        <div id="zg-box" title="Zeitgeist-Zeiterfassung"></div>
        <button type="button" class="nav-btn" id="nav-overview"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> Übersicht</button>
        <div class="nav-split">
            <button type="button" class="nav-btn" id="nav-break"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg> Pause<span class="nav-side" id="nav-break-left"></span></button>
            <button type="button" class="nav-gear" id="nav-break-cfg" aria-label="Pausen-Einstellungen öffnen" title="Pausen-Einstellungen — wie lange und wie oft"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.3a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2.7a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V2.7a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1h.3a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div>
        <details id="sidebar-tools">
            <summary>
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                Werkzeuge
                <svg class="ico tool-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </summary>
            <div class="sidebar-tool-menu">
                <button type="button" class="nav-btn" id="nav-search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Suche</button>
                <button type="button" class="nav-btn" id="nav-timeline"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Verlauf</button>
                <button type="button" class="nav-btn" id="nav-graph"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg> Git-Graph</button>
                <button type="button" class="nav-btn" id="nav-board"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10" y="3" width="6" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/></svg> Board</button>
                <button type="button" class="nav-btn" id="nav-dock" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg> Terminal-Dock <span class="nav-key">⌃`</span></button>
                <button type="button" class="nav-btn" id="nav-stats"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-3"/></svg> Statistik</button>
            </div>
        </details>
        <div id="usage-box"></div>
    </aside>
    <main id="main">
        <div id="overview"></div>
        <div id="search-view">
            <div id="search-bar">
                <input class="inline-input wide" id="search-input" placeholder="Volltextsuche über alle Claude-Session-Transkripte… (Enter)">
                <button class="btn" id="search-go">Suchen</button>
            </div>
            <div id="search-results"></div>
        </div>
        <div id="graph-view"></div>
        <div id="board-view"></div>
        <div id="stats-view"></div>
        <div id="terms">
            <div id="term-bar"></div>
            <div id="hydra-grid"></div>
            <section id="term-session-state" aria-live="polite">
                <span class="term-state-icon" id="term-state-icon" aria-hidden="true"></span>
                <span class="term-state-copy">
                    <strong id="term-state-title">Session bereit</strong>
                    <span id="term-state-detail">Du kannst direkt im Terminal oder über das Nachrichtenfeld arbeiten.</span>
                </span>
            </section>
            <form id="term-composer">
                <label class="sr-only" for="term-prompt">Nachricht an die aktive Session</label>
                <textarea id="term-prompt" name="term-prompt" rows="3" spellcheck="true" placeholder="Nachricht an die Session …"></textarea>
                <div class="term-compose-toolbar">
                    <span class="term-compose-meta">
                        <button type="button" class="term-attach" id="term-attach" aria-label="Bild anhängen" title="Bild anhängen">
                            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <span id="term-compose-hint">↵ senden · ⇧↵ Zeilenumbruch · Bilder einfügen</span>
                    </span>
                    <button type="submit" id="term-send" aria-label="Nachricht senden" title="Nachricht senden (Enter)" disabled>
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                    </button>
                    <input id="term-image" type="file" accept="image/*" hidden>
                </div>
            </form>
        </div>
    </main>
    <aside id="timeline">
        <div id="tl-head"><span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Verlauf — alle Prompts</span><button class="btn tiny" id="tl-close" aria-label="Verlauf schließen"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <div id="tl-body"><div class="none">lade…</div></div>
    </aside>
</div>
<div id="toast"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
