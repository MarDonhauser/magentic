<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>magentic</title>
</head>
<body>
<div id="titlebar"></div>
<div id="layout">
    <aside id="sidebar">
        <div id="sidebar-head"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg> magentic</div>
        <div class="nav-btn" id="nav-overview"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> Übersicht</div>
        <div class="nav-btn" id="nav-search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Suche</div>
        <div class="nav-btn" id="nav-timeline"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Verlauf</div>
        <div id="deploy-badge" title="Deploy-Stand — klick für Details"></div>
        <div class="side-label">Sessions</div>
        <div id="sessions"></div>
        <div class="side-label" id="side-todos-label">Todos</div>
        <div id="side-todos"></div>
        <div id="zg-box" title="Zeitgeist-Zeiterfassung"></div>
        <div id="usage-box"></div>
    </aside>
    <main id="main">
        <div id="overview"></div>
        <div id="search-view">
            <div id="search-bar">
                <input class="inline-input wide" id="search-input" placeholder="Volltextsuche über alle Claude-Session-Transkripte… (Enter)">
                <button class="btn" id="search-go">Suchen</button>
            </div>
            <div id="search-results"></div>
        </div>
        <div id="terms"><div id="term-bar"></div><div id="hydra-grid"></div></div>
    </main>
    <aside id="timeline">
        <div id="tl-head"><span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Verlauf — deine Prompts</span><button class="btn tiny" id="tl-close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <div id="tl-body"><div class="none">lade…</div></div>
    </aside>
</div>
<div id="toast"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
