<!DOCTYPE html>
<html lang="de">
<head>

        <div class="nav-btn" id="nav-timeline"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Verlauf</div>
        <div class="nav-btn" id="nav-graph"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg> Git-Graph</div>

        <div id="attention"></div>
        <div class="side-label">Sessions</div>
        <div id="sessions"></div>
        <div id="zg-box" title="Zeitgeist-Zeiterfassung"></div>
        <div id="usage-box"></div>

    <main id="main">
        <div id="overview"></div>
        <div id="search-view">
            <div id="search-bar">
                <input class="inline-input wide" id="search-input" placeholder="Volltextsuche über alle Claude-Session-Transkripte… (Enter)">
                <button class="btn" id="search-go">Suchen</button>
            </div>
            <div id="search-results"></div>
        </div>
        <div id="graph-view"></div>
        <div id="board-view"></div>
        <div id="stats-view"></div>
        <div id="terms"><div id="term-bar"></div><div id="hydra-grid"></div></div>
    </main>
    <aside id="timeline">
        <div id="tl-head"><span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Verlauf — deine Prompts</span><button class="btn tiny" id="tl-close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <div id="tl-body"><div class="none">lade…</div></div>

<script src="./src/main.js" type="module"></script>
