name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (MAJOR.MINOR.PATCH); builds artifacts without publishing"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      MAGENTIC_NOTARIZE: "true"
      MAGENTIC_SIGN_IDENTITY: ${{ vars.MAGENTIC_SIGN_IDENTITY }}
      MAGENTIC_APPLE_API_KEY_ID: ${{ vars.MAGENTIC_APPLE_API_KEY_ID }}
      MAGENTIC_APPLE_API_ISSUER_ID: ${{ vars.MAGENTIC_APPLE_API_ISSUER_ID }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            go.sum
            app/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Tests und Frontend
        run: |
          go test ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./scripts/test-native-updates.sh
          cd app/frontend
          npm ci
          npm test
          npm run build
          cd ..
          go test ./...
      - name: Wails installieren
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Apple-Signierung einrichten
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAGENTIC_APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAGENTIC_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.MAGENTIC_APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE_BASE64" && test -n "$CERTIFICATE_PASSWORD" && test -n "$APPLE_API_PRIVATE_KEY"
          test -n "$MAGENTIC_SIGN_IDENTITY" && test -n "$MAGENTIC_APPLE_API_KEY_ID" && test -n "$MAGENTIC_APPLE_API_ISSUER_ID"
          KEYCHAIN="$RUNNER_TEMP/magentic-signing.keychain-db"
          CERTIFICATE_FILE="$RUNNER_TEMP/magentic-certificate.p12"
          API_KEY_FILE="$RUNNER_TEMP/magentic-notary-key.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_FILE"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_FILE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          echo "MAGENTIC_APPLE_API_KEY_FILE=$API_KEY_FILE" >> "$GITHUB_ENV"
      - name: Signierte Update-Artefakte bauen
        env:
          MAGENTIC_UPDATE_PUBLIC_KEY: ${{ vars.MAGENTIC_UPDATE_PUBLIC_KEY }}
          UPDATE_PRIVATE_KEY: ${{ secrets.MAGENTIC_UPDATE_PRIVATE_KEY }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$MAGENTIC_UPDATE_PUBLIC_KEY" || { echo 'Repository-Variable MAGENTIC_UPDATE_PUBLIC_KEY fehlt.' >&2; exit 1; }
          test -n "$UPDATE_PRIVATE_KEY" || { echo 'Repository-Secret MAGENTIC_UPDATE_PRIVATE_KEY fehlt.' >&2; exit 1; }
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$KEY_FILE"
          unset UPDATE_PRIVATE_KEY
          export MAGENTIC_UPDATE_PRIVATE_KEY_FILE="$KEY_FILE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$REQUESTED_VERSION"
          fi
          ./scripts/build-release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/magentic-release"
          ./scripts/test-native-updates.sh
      - uses: actions/upload-artifact@v6
        with:
          name: magentic-desktop-release
          path: ${{ runner.temp }}/magentic-release/*
          if-no-files-found: error
      - name: Release veröffentlichen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The stable feed always points to GitHub's latest release. Refuse
          # older versions so publishing a maintenance tag cannot downgrade it.
          export PUBLISHED_TAGS="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName)"
          python3 - <<'PY'
          import json, os, re
          def version(tag):
              return tuple(map(int, tag[1:].split('.'))) if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) else None
          target = version(os.environ['GITHUB_REF_NAME'])
          published = [version(r['tagName']) for r in json.loads(os.environ['PUBLISHED_TAGS'])]
          if target is None or any(v is not None and v >= target for v in published):
              raise SystemExit('Die Release-Version muss neuer als alle veröffentlichten stabilen Versionen sein.')
          PY
          # Upload all files to a draft before making the feed discoverable.
          # Existing releases are immutable: a rerun must not replace an archive
          # that installed apps have already authenticated from the feed.
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/magentic-release/* \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Signierdaten entfernen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/magentic-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/magentic-signing.keychain-db"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ('magentic-certificate.p12', 'magentic-notary-key.p8'):
              (Path(os.environ['RUNNER_TEMP']) / name).unlink(missing_ok=True)
          PY
